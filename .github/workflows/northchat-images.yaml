name: Build North Chat images

# Manual build (Actions -> Build North Chat images -> Run workflow).
# Also runs when a tag starting with northchat- is pushed.
on:
  workflow_dispatch:
  push:
    tags:
      - "northchat-*"

permissions:
  contents: read
  packages: write

concurrency:
  group: northchat-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: Build base image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/northchat-base:latest
          cache-from: type=gha,scope=northchat-base
          cache-to: type=gha,scope=northchat-base,mode=max

  services:
    name: Build ${{ matrix.name }}
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: crates/delta/Dockerfile
          - name: events
            file: crates/bonfire/Dockerfile
          - name: files
            file: crates/services/autumn/Dockerfile
          - name: proxy
            file: crates/services/january/Dockerfile
          - name: gifbox
            file: crates/services/gifbox/Dockerfile
          - name: crond
            file: crates/daemons/crond/Dockerfile
          - name: pushd
            file: crates/daemons/pushd/Dockerfile
          - name: voice-ingress
            file: crates/daemons/voice-ingress/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: ${{ matrix.file }}
          tags: ghcr.io/${{ github.repository_owner }}/northchat-${{ matrix.name }}:latest
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/northchat-base:latest
          cache-from: type=gha,scope=northchat-${{ matrix.name }}
          cache-to: type=gha,scope=northchat-${{ matrix.name }},mode=max
